name: Build and upload MegaFaucet test video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "make_reel.py"
      - ".github/workflows/render-test.yml"

permissions:
  contents: write

concurrency:
  group: megafaucet-test-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install rendering and voice dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install "numpy<3" pillow edge-tts
      - name: Create test MP4
        run: python make_reel.py --output media/github-upload-test.mp4
      - name: Verify generated video
        run: |
          test -s media/github-upload-test.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 media/github-upload-test.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 media/github-upload-test.mp4
      - name: Upload finished video to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/github-upload-test.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Upload rendered MP4 pipeline test"
            git push
          fi
